
syntax = "proto3";

package usecase.example;

import "protobuf_extensions/codegen_componenent_options.proto";
    

message ExampleCommand {
    string message = 1;
}

message ExampleResult {
    string message = 1;
}

service ExampleUseCase {
    rpc Example(ExampleCommand) returns (ExampleResult) {
        option (codegen.options.flat_arguments) = true;
        option (codegen.options.flat_response) = true;
    }
}

    